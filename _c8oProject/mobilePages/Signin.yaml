      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public getSignInErrorMessage(loginOut) {
        		var errorObj = loginOut != null && loginOut.error != null ? loginOut.error : null;
        		if (errorObj == null) {
        			return this.translate.instant(''Auth_Authentication_Failed'');
        		}
        		var code = errorObj.code != null ? ('''' + errorObj.code) : '''';
        		if (code == ''2'') {
        			return this.translate.instant(''Auth_Login_Error_Code_2'');
        		}
        		if (code == ''3'') {
        			return this.translate.instant(''Auth_Login_Error_Code_3'');
        		}
        		if (code == ''4'') {
        			return this.translate.instant(''Auth_Login_Error_Code_4'');
        		}
        		if (errorObj.message != null && errorObj.message != '''') {
        			return errorObj.message;
        		}
        		if (code != '''') {
        			return this.translate.instant(''Auth_Login_Error_Unknown'') + '' ('' + code + '')'';
        		}
        		return this.translate.instant(''Auth_Authentication_Failed'');
        	}
        	public getForgotPasswordErrorMessage(forgotOut) {
        		var errorObj = forgotOut != null && forgotOut.error != null ? forgotOut.error : null;
        		if (errorObj == null) {
        			return this.translate.instant(''Auth_ForgotPassword_Failed'');
        		}
        		var code = errorObj.code != null ? ('''' + errorObj.code) : '''';
        		if (code == ''2'') {
        			return this.translate.instant(''Auth_ForgotPassword_Error_Code_2'');
        		}
        		if (errorObj.message != null && errorObj.message != '''') {
        			return errorObj.message;
        		}
        		if (code != '''') {
        			return this.translate.instant(''Auth_ForgotPassword_Error_Unknown'') + '' ('' + code + '')'';
        		}
        		return this.translate.instant(''Auth_ForgotPassword_Failed'');
        	}
        	public toggleShowPassword() {
        		this.local = this.local || {};
        		this.local.showPassword = !this.local.showPassword;
        	}
        	public toggleShowCreatePassword() {
        		this.local = this.local || {};
        		this.local.showCreatePassword = !this.local.showCreatePassword;
        	}
        	/*End_c8o_PageFunction*/
        '
